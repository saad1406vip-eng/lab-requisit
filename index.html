        * { margin: 0; padding: 0; box-sizing: border-box; }

            background-attachment: fixed;
            background-repeat: no-repeat;
            color: #1a202c;
            min-height: 100vh;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            border-bottom: 3px solid #0369a1;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            position: sticky; top: 0; z-index: 50;
            backdrop-filter: blur(5px);
        }
        .container { max-width: 1280px; margin: 0 auto; padding: 0 1rem; }
        
        .card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 1.5rem; 
            border-right: 4px solid #0369a1;
            backdrop-filter: blur(5px);
        }
        
        .btn {
            padding: 0.5rem 1rem; border-radius: 0.5rem;
            font-weight: 600; cursor: pointer;
            transition: all 0.3s; border: none;
        }
        .btn-primary { background: #0369a1; color: white; }
        .btn-primary:hover { background: #075985; }
        .btn-success { background: #16a34a; color: white; }
        .btn-success:hover { background: #15803d; }
        .btn-danger { background: #dc2626; color: white; }
        .btn-danger:hover { background: #b91c1c; }
        .btn-whatsapp { background: #25D366; color: white; }
        .btn-whatsapp:hover { background: #128C7E; }
        
        .input-field {
            border: 2px solid #d1d5db; border-radius: 0.5rem;
            padding: 0.5rem 1rem; width: 100%; font-size: 0.95rem;
            background: white;
        }
        .input-field:focus {
            outline: none; border-color: #0369a1;
            box-shadow: 0 0 0 3px rgba(3, 105, 161, 0.1);
        }
        
        .badge {
            display: inline-block; padding: 0.25rem 0.75rem;
            border-radius: 9999px; font-size: 0.75rem; font-weight: 600;
        }
        
        .item-card {
            display: flex; justify-content: space-between;
            align-items: center; padding: 1rem;
            border: 1px solid #e5e7eb; border-radius: 0.5rem;
            margin-bottom: 0.75rem; transition: all 0.2s;
            background: white;
        }
        .item-card:hover { border-color: #0369a1; box-shadow: 0 2px 8px rgba(3,105,161,0.15); }
        
        .item-info { flex: 1; }
        .item-name { font-weight: 700; color: #0f172a; font-size: 0.95rem; }
        .item-code { font-size: 0.8rem; color: #475569; margin-top: 4px; line-height: 1.5; }
        .item-actions { display: flex; gap: 0.5rem; align-items: center; }
        
        .quantity-input {
            width: 80px; padding: 0.4rem;
            border: 1px solid #cbd5e1; border-radius: 0.375rem;
            text-align: center; font-weight: 700; font-size: 1rem;
        }
        
        .filter-bar {
            display: flex; gap: 0.5rem; flex-wrap: wrap;
            margin-bottom: 1rem; padding: 0.75rem;
            background: rgba(248, 250, 252, 0.9); border-radius: 0.5rem;
            border: 1px solid #e2e8f0;
        }
        .filter-btn {
            padding: 0.4rem 0.9rem; border-radius: 9999px;
            font-size: 0.8rem; font-weight: 600;
            cursor: pointer; border: 1px solid #cbd5e1;
            background: white; transition: all 0.2s; color: #334155;
        }
        .filter-btn.active { background: #0369a1; color: white; border-color: #0369a1; }
        .filter-btn:hover { background: #e0f2fe; }
        .filter-btn.active:hover { background: #075985; }
        
        .summary-box {
            background: linear-gradient(135deg, rgba(224, 242, 254, 0.95) 0%, rgba(224, 231, 255, 0.95) 100%);
            border-radius: 0.5rem; padding: 1rem;
            margin-bottom: 1rem; border-right: 4px solid #0369a1;
        }
        
        .empty-state { text-align: center; padding: 3rem; color: #64748b; font-size: 1.1rem; background: white; border-radius: 0.5rem;}
        
        .toast {
            position: fixed; bottom: 20px; left: 50%;
            transform: translateX(-50%);
            background: #0f172a; color: white;
            padding: 0.75rem 1.5rem; border-radius: 0.5rem;
            z-index: 1000; opacity: 0; transition: opacity 0.3s;
            font-weight: 600; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }
        .toast.show { opacity: 1; }
    </style>

            { id: 'cons_10', category: 'مستهلكات عامة', device: 'مستهلكات عامة', name: 'URINE CONTAINER', code: 'VAVA.1248', govCode: '787801248', nupco: '411041120150', rocheCatalog: '-', boxSize: 400, unit: 'علبة' }
        ];

        const app = {
            cart: [],
            currentView: 'browse',
            searchQuery: '',
            selectedDevice: 'الكل',
            requesterName: 'سعد علي سعد القرني',
            requesterTitle: 'رئيس قسم المختبرات',
            department: 'مختبر مستشفى سبت العلاية العام',
            notes: '',

            init() { this.loadCart(); this.render(); },

            loadCart() {
                const saved = localStorage.getItem('lab_cart_v3');
                if (saved) this.cart = JSON.parse(saved);
            },

            saveCart() { localStorage.setItem('lab_cart_v3', JSON.stringify(this.cart)); },

            showToast(msg) {
                const t = document.getElementById('toast');
                t.textContent = msg; t.classList.add('show');
                setTimeout(() => t.classList.remove('show'), 2200);
            },

            calculateTotal(item) {
                const kits = parseInt(item.quantity) || 1;
                if (item.boxSize && !isNaN(parseFloat(item.boxSize))) {
                    return kits * parseFloat(item.boxSize);
                }
                return kits;
            },

            addItemToCart(itemId) {
                const item = allItems.find(i => i.id === itemId);
                if (!item) return;
                const existing = this.cart.find(c => c.id === item.id);
                if (existing) existing.quantity = (parseInt(existing.quantity) || 1) + 1;
                else this.cart.push({ ...item, quantity: 1 });
                this.saveCart(); this.showToast(`✅ تمت الإضافة`);
                if(this.currentView === 'browse') this.render();
            },

            removeFromCart(itemId) {
                this.cart = this.cart.filter(item => item.id !== itemId);
                this.saveCart(); this.render();
            },

            updateQuantity(itemId, newQty) {
                const item = this.cart.find(c => c.id === itemId);
                if (item) {
                    const q = parseInt(newQty);
                    item.quantity = (q && q > 0) ? q : 1;
                    this.saveCart();
                }
            },

            clearCart() {
                if (this.cart.length === 0) return;
                if (confirm('هل أنت متأكد من حذف جميع البنود؟')) {
                    this.cart = []; this.saveCart(); this.render();
                }
            },

            getDevices() {
                const devs = new Set();
                allItems.forEach(i => { if (i.device) devs.add(i.device); });
                return ['الكل', ...Array.from(devs)];
            },

            getFilteredItems() {
                return allItems.filter(item => {
                    const matchDev = this.selectedDevice === 'الكل' || item.device === this.selectedDevice;
                    const q = this.searchQuery.trim().toLowerCase();
                    const matchSearch = !q ||
                        item.name.toLowerCase().includes(q) ||
                        (item.code || '').toLowerCase().includes(q) ||
                        (item.govCode || '').toLowerCase().includes(q) ||
                        (item.nupco || '').toLowerCase().includes(q);
                    return matchDev && matchSearch;
                });
            },

            buildOrderText() {
                const now = new Date();
                let text = `*طلب مستهلكات ومواد مخبرية*\n📍 ${this.department}\n👤 ${this.requesterName}\n📅 ${now.toLocaleDateString('ar-SA')}\n━━━━━━━━━━━━━━━━━━━━\n\n`;
                let totalKits = 0;
                this.cart.forEach((item, idx) => {
                    const kits = parseInt(item.quantity) || 1;
                    totalKits += kits;
                    text += `*${idx + 1}. ${item.name}* [${item.device}]\n`;
                    if (item.govCode) text += `   🏛️ وزاري: ${item.govCode}\n`;
                    text += `   📥 عدد الكت: *${kits}* (الإجمالي: ${this.calculateTotal(item)} ${item.unit})\n\n`;
                });
                return text;
            },

            shareWhatsApp() {
                if (this.cart.length === 0) return alert('الطلبية فارغة');
                window.open(`https://wa.me/?text=${encodeURIComponent(this.buildOrderText())}`, '_blank');
            },

            printRequisition() {
                if (this.cart.length === 0) return alert('الطلبية فارغة');
                const now = new Date();
                const dateStr = now.toLocaleDateString('en-GB');
                let totalKits = 0, grandTotal = 0;
                this.cart.forEach(item => { totalKits += parseInt(item.quantity) || 1; grandTotal += this.calculateTotal(item); });

                const html = `<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8"><title>طلب مخبري</title>
<style>
    @page { size: A4 portrait; margin: 0; } /* الطباعة عمودية */
    body { 
        font-family: 'Segoe UI', Tahoma, Arial, sans-serif; 
        margin: 0; padding: 0; color: #000;
        background-image: url('BG.PNG'); /* الخلفية العمودية */
        background-size: 100% 100%;
        background-repeat: no-repeat;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }
    .page-content { padding: 3.5cm 1.5cm 3.5cm 1.5cm; min-height: 100vh; box-sizing: border-box; }
    .title-container { text-align: center; margin-bottom: 15px; }
    .title { display: inline-block; background: #0369a1; color: white; padding: 6px 30px; font-size: 16px; font-weight: 700; border-radius: 6px; }
    .info-bar { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 10px; font-weight: 600; background: rgba(255,255,255,0.8); padding: 5px; border-radius: 4px; }
    table { width: 100%; border-collapse: collapse; font-size: 10px; background: rgba(255,255,255,0.9); }
    th { background: #0369a1; color: white; padding: 6px 2px; text-align: center; border: 1px solid #0369a1; }
    td { border: 1px solid #999; padding: 4px 2px; text-align: center; }
    tr:nth-child(even) td { background: #f0f9ff; }
    td.name { text-align: right; font-weight: 700; }
    .total-row td { background: #065f46 !important; color: white !important; font-weight: 700; }
    .sig-container { display: flex; justify-content: space-between; margin-top: 30px; background: rgba(255,255,255,0.8); padding: 15px; border-radius: 6px; }
    .sig-box { text-align: center; width: 200px; }
    .sig-line { border-top: 2px solid #000; margin-top: 35px; padding-top: 5px; font-size: 12px; font-weight: 700; }
</style></head><body>
<div class="page-content">
    <div class="title-container"><div class="title">طلب مستهلكات ومواد مخبرية</div></div>
    <div class="info-bar">
        <div><strong>التاريخ:</strong> ${dateStr}</div>
        <div><strong>عدد البنود:</strong> ${this.cart.length}</div>
        <div><strong>مقدم الطلب:</strong> ${this.requesterName}</div>
    </div>
    <table>
        <thead><tr>
            <th width="3%">م</th><th width="25%">اسم الصنف / الكود</th><th width="15%">الجهاز / القسم</th><th width="12%">الرقم الوزاري</th><th width="15%">رقم نوبكو</th><th width="8%">عدد الكت</th><th width="8%">حجم العبوة</th><th width="10%">الإجمالي</th>
        </tr></thead>
        <tbody>
        ${this.cart.map((item, idx) => {
            const kits = parseInt(item.quantity) || 1;
            const total = this.calculateTotal(item);
            return `<tr>
                <td>${idx + 1}</td>
                <td class="name">${item.name}<br><small style="color:#444;font-weight:400;">${item.code || ''}</small></td>
                <td><strong style="color:#0369a1;">${item.device}</strong></td>
                <td>${item.govCode || '-'}</td>
                <td>${item.nupco || '-'}</td>
                <td>${kits}</td>
                <td>${item.boxSize || '-'}</td>
                <td><strong>${total}</strong> ${item.unit || ''}</td>
            </tr>`;
        }).join('')}
            <tr class="total-row">
                <td colspan="5">الإجمالي</td>
                <td>${totalKits} كت</td><td>-</td><td>${grandTotal}</td>
            </tr>
        </tbody>
    </table>
    <div class="sig-container">
        <div class="sig-box"><div style="font-weight:700;font-size:12px;">مقدم الطلب</div><div class="sig-line">${this.requesterName}</div></div>
        <div class="sig-box"><div style="font-weight:700;font-size:12px;">مدير المختبر</div><div class="sig-line">........................</div></div>
        <div class="sig-box"><div style="font-weight:700;font-size:12px;">التموين</div><div class="sig-line">........................</div></div>
    </div>
</div>
<script>window.onload=function(){setTimeout(function(){window.print();},500);};<\/script>
</body></html>`;
                const w = window.open('', '_blank');
                w.document.write(html); w.document.close();
            },

            render() {
                document.getElementById('app').innerHTML = `
                <div class="header no-print">
                    <div class="container" style="padding: 0.75rem 0;">
                        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem;">
                            <h1 style="font-size: 1.15rem; font-weight: 700; color: #0369a1; margin: 0;">📋 إدارة الطلبيات</h1>
                            <div style="display: flex; gap: 0.4rem; flex-wrap: wrap;">
                                ${this.currentView === 'browse' ? 
                                    `<button class="btn btn-primary" onclick="app.currentView='cart';app.render();" style="font-size:0.85rem;">🛒 الطلبية (${this.cart.length})</button>` :
                                    `<button class="btn btn-primary" onclick="app.currentView='browse';app.render();" style="font-size:0.85rem;">🔙 المتصفح</button>`
                                }
                            </div>
                        </div>
                    </div>
                </div>

                <div class="container" style="padding: 1rem 0;">
                    <div class="card">
                        ${this.currentView === 'cart' ? this.renderCart() : this.renderBrowse()}
                    </div>
                </div>
                `;
            },

            renderBrowse() {
                const filtered = this.getFilteredItems();
                const devices = this.getDevices();

                return `
                    <h2 style="margin-bottom: 1rem; color: #0f172a; font-size: 1.1rem;">📚 البنود (${allItems.length})</h2>
                    
                    <div style="margin-bottom: 1rem;">
                        <label style="font-weight:700; font-size:0.9rem; display:block; margin-bottom:5px;">⚙️ اختر الجهاز / القسم:</label>
                        <select class="input-field" onchange="app.selectedDevice=this.value;app.render();" style="font-weight:bold; color:#0369a1;">
                            ${devices.map(d => `<option value="${d}" ${this.selectedDevice === d ? 'selected' : ''}>${d}</option>`).join('')}
                        </select>
                    </div>

                    <div style="margin-bottom: 1rem;">
                        <input type="text" class="input-field" placeholder="🔍 ابحث عن صنف معين..." value="${this.searchQuery}" oninput="app.searchQuery=this.value;app.render();">
                    </div>
                    
                    ${filtered.map(item => `
                        <div class="item-card">
                            <div class="item-info">
                                <div class="item-name">${item.name}</div>
                                <div class="item-code">
                                    <span class="badge" style="background:#e0f2fe; color:#0369a1;">${item.device}</span>
                                    ${item.code ? ` • 🔖 ${item.code}` : ''} ${item.govCode ? ` • 🏛️ ${item.govCode}` : ''} 
                                    ${item.boxSize ? `<br><span class="badge" style="background:#fef3c7;color:#92400e;margin-top:4px;">📦 ${item.boxSize} ${item.unit}</span>` : ''}
                                </div>
                            </div>
                            <button class="btn btn-success" onclick="app.addItemToCart('${item.id}');" style="padding:0.4rem 0.8rem;">➕ أضف</button>
                        </div>
                    `).join('')}
                `;
            },

            renderCart() {
                let totalKits = 0, grandTotal = 0;
                this.cart.forEach(item => { totalKits += parseInt(item.quantity) || 1; grandTotal += this.calculateTotal(item); });

                return `
                    <h2 style="margin-bottom: 1rem; color: #0f172a; font-size: 1.1rem;">🛒 الطلبية الحالية</h2>
                    ${this.cart.length === 0 ? `<div class="empty-state">الطلبية فارغة</div>` : `
                        <div class="summary-box">
                            <strong>الملخص:</strong> ${this.cart.length} بند | ${totalKits} كت | ${grandTotal} إجمالي الوحدات
                        </div>
                        ${this.cart.map(item => `
                            <div class="item-card">
                                <div class="item-info">
                                    <div class="item-name">${item.name}</div>
                                    <div class="item-code"><span class="badge" style="background:#e0f2fe; color:#0369a1;">${item.device}</span> ${item.govCode ? ` • 🏛️ ${item.govCode}` : ''}</div>
                                </div>
                                <div class="item-actions">
                                    <input type="number" class="quantity-input" value="${item.quantity}" onchange="app.updateQuantity('${item.id}',this.value);app.render();">
                                    <button class="btn btn-danger" onclick="app.removeFromCart('${item.id}');" style="padding:0.4rem 0.8rem;">🗑️</button>
                                </div>
                            </div>
                        `).join('')}
                        
                        <div style="margin-top:1.5rem;display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;">
                            <button class="btn btn-success" onclick="app.printRequisition();" style="grid-column: span 2;">🖨️ طباعة الطلبية (الورقة الرسمية)</button>
                            <button class="btn btn-whatsapp" onclick="app.shareWhatsApp();">📱 واتساب</button>
                            <button class="btn btn-danger" onclick="app.clearCart();">🗑️ حذف الكل</button>
                        </div>
                    `}
                `;
            }
        };

        app.init();
    </script>
</body>
</html>
