                this.saveCart();
                this.showToast(`✅ "${item.name}"`);
                this.render();

                this.cart = this.cart.filter(item => item.id !== itemId);

                    this.saveCart();

                            this.currentView === 'cart' ?
                            `<button class="btn btn-primary" onclick="app.currentView='browse';app.render();" style="font-size:0.85rem;">🔙 المتصفح</button>
                             <button class="btn btn-primary" onclick="app.currentView='add';app.render();" style="font-size:0.85rem;">➕ بند جديد</button>` :
                            `<button class="btn btn-primary" onclick="app.currentView='browse';app.render();" style="font-size:0.85rem;">🔙 المتصفح</button>
                             <button class="btn btn-success" onclick="app.currentView='cart';app.render();" style="font-size:0.85rem;">🛒 الطلبية (${this.cart.length})</button>`
                        }
                    </div>
                </div>
            </div></div>`;
            },

            renderContent() {
                if (this.currentView === 'add') return this.renderAddForm();
                if (this.currentView === 'cart') return this.renderCart();
                return this.renderBrowse();
            },

            renderBrowse() {
                const filtered = this.getFilteredItems();
                const stats = this.getStats();
                const categories = ['الكل', ...Object.keys(stats)];
                const subCategories = this.getSubCategories();

                return `
                <div class="container" style="padding: 1rem 0;">
                    <div class="card">
                        <div class="summary-box">
                            <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:0.5rem;align-items:center;">
                                <div>
                                    <strong style="color:#1e40af;">📊 إحصائيات قاعدة البيانات</strong>
                                    <div style="margin-top:0.4rem;font-size:0.85rem;color:#374151;">
                                        إجمالي: <strong>${allItems.length}</strong> بند
                                        ${Object.entries(stats).map(([k,v]) => ` • ${k}: <strong>${v}</strong>`).join('')}
                                    </div>
                                </div>
                                ${this.cart.length > 0 ? `<div class="total-amount">🛒 ${this.cart.length} بند</div>` : ''}
                            </div>
                        </div>

                        <h2 style="margin-bottom: 1rem; color: #1f2937; font-size: 1.1rem;">📚 قائمة البنود</h2>

                        <div style="margin-bottom: 1rem;">
                            <input type="text" class="input-field" id="searchInput" placeholder="🔍 ابحث بالاسم أو الكود أو الرقم الوزاري أو كتالوج روش..."
                                value="${this.searchQuery}" oninput="app.searchQuery=this.value;app.render();">
                        </div>

                        <div class="filter-bar">
                            ${categories.map(cat => `
                                <button class="filter-btn ${this.selectedCategory === cat ? 'active' : ''}"
                                    onclick="app.selectedCategory='${cat}';app.selectedSubCategory='الكل';app.render();">
                                    ${cat} ${cat !== 'الكل' ? `(${stats[cat] || 0})` : ''}
                                </button>
                            `).join('')}
                        </div>

                        ${subCategories.length > 1 ? `
                        <div class="filter-bar" style="background:#fef3c7;border-color:#fcd34d;">
                            <span style="font-size:0.8rem;font-weight:600;color:#92400e;align-self:center;">الفئة الفرعية:</span>
                            ${subCategories.map(sub => `
                                <button class="filter-btn ${this.selectedSubCategory === sub ? 'active' : ''}"
                                    onclick="app.selectedSubCategory='${sub}';app.render();" style="font-size:0.75rem;">
                                    ${sub}
                                </button>
                            `).join('')}
                        </div>` : ''}

                        <div style="margin-bottom:0.5rem;color:#6b7280;font-size:0.85rem;">النتائج: ${filtered.length} بند</div>

                        ${filtered.length === 0 ?
                            `<div class="empty-state">🔍 لا توجد نتائج</div>` :
                            filtered.map(item => `
                                <div class="item-card">
                                    <div class="item-info">
                                        <div class="item-name">${item.name}</div>
                                        <div class="item-code">
                                            ${item.code ? `🔖 ${item.code}` : ''}
                                            ${item.govCode ? ` • 🏛️ ${item.govCode}` : ''}
                                            ${item.nupco ? ` • 📦 ${item.nupco}` : ''}
                                            ${item.rocheCatalog ? ` • 🧬 روش: ${item.rocheCatalog}` : ''}
                                            <br>
                                            <span class="badge" style="background:#e0e7ff;color:#3730a3;margin-top:4px;">${item.category}</span>
                                            ${item.subCategory ? `<span class="badge" style="background:#dbeafe;color:#1e40af;margin-top:4px;">${item.subCategory}</span>` : ''}
                                            ${item.boxSize ? `<span class="badge" style="background:#fef3c7;color:#92400e;margin-top:4px;">📦 ${item.boxSize} ${item.unit || ''}</span>` : ''}
                                            ${item.unitDevice ? `<span class="badge" style="background:#fce7f3;color:#9d174d;margin-top:4px;">⚙️ ${item.unitDevice}</span>` : ''}
                                        </div>
                                    </div>
                                    <div class="item-actions">
                                        <button class="btn btn-success" onclick="app.addItemToCart('${item.id}');" style="font-size:0.8rem;padding:0.4rem 0.7rem;">➕</button>
                                        <button class="btn btn-danger" onclick="app.deleteItem('${item.id}');" style="font-size:0.8rem;padding:0.4rem 0.7rem;">🗑️</button>
                                    </div>
                                </div>
                            `).join('')
                        }
                    </div>
                </div>`;
            },

            renderCart() {
                let totalKits = 0, grandTotal = 0;
                this.cart.forEach(item => { totalKits += parseInt(item.quantity) || 1; grandTotal += this.calculateTotal(item); });

                return `
                <div class="container" style="padding: 1rem 0;">
                    <div class="card">
                        <h2 style="margin-bottom: 1rem; color: #1f2937; font-size: 1.1rem;">🛒 الطلبية (${this.cart.length})</h2>
                        ${this.cart.length === 0 ?
                            `<div class="empty-state">🛒 لا توجد بنود</div>` :
                            `
                            <div class="summary-box">
                                <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:0.5rem;">
                                    <div>📦 البنود: <strong>${this.cart.length}</strong></div>
                                    <div>🧪 الكت: <strong>${totalKits}</strong></div>
                                    <div>📊 الوحدات: <strong>${grandTotal}</strong></div>
                                </div>
                            </div>
                            ${this.cart.map(item => {
                                const kits = parseInt(item.quantity) || 1;
                                const total = this.calculateTotal(item);
                                const hasBox = item.boxSize && !isNaN(parseFloat(item.boxSize));
                                return `
                                <div class="item-card">
                                    <div class="item-info">
                                        <div class="item-name">${item.name}</div>
                                        <div class="item-code">
                                            ${item.code ? `🔖 ${item.code}` : ''}
                                            ${item.govCode ? ` • 🏛️ ${item.govCode}` : ''}
                                            ${item.nupco ? ` • 📦 ${item.nupco}` : ''}
                                            ${item.rocheCatalog ? ` • 🧬 ${item.rocheCatalog}` : ''}
                                            <br>
                                            <span class="badge" style="background:#e0e7ff;color:#3730a3;">${item.category}</span>
                                            ${item.subCategory ? `<span class="badge" style="background:#dbeafe;color:#1e40af;">${item.subCategory}</span>` : ''}
                                            ${hasBox ? `<span class="badge" style="background:#fef3c7;color:#92400e;">📦 ${item.boxSize} ${item.unit || ''}/كت</span>` : ''}
                                        </div>
                                        <div style="margin-top:0.5rem;padding:0.4rem 0.7rem;background:#dcfce7;border-radius:0.4rem;display:inline-block;font-size:0.8rem;">
                                            ✅ الإجمالي: <strong>${total}</strong> ${hasBox ? (item.unit || '') : ''}
                                            ${hasBox ? `<span style="color:#166534;">(${kits} كت × ${item.boxSize})</span>` : ''}
                                        </div>
                                    </div>
                                    <div class="item-actions" style="flex-direction:column;gap:0.3rem;">
                                        <div style="display:flex;align-items:center;gap:0.3rem;">
                                            <label style="font-size:0.75rem;color:#6b7280;">عدد الكت:</label>
                                            <input type="number" min="1" value="${kits}" class="quantity-input"
                                                onchange="app.updateQuantity('${item.id}',this.value);app.render();">
                                        </div>
                                        <button class="btn btn-danger" onclick="app.removeFromCart('${item.id}');" style="font-size:0.75rem;padding:0.3rem 0.6rem;">🗑️ حذف</button>
                                    </div>
                                </div>`;
                            }).join('')}

                            <div style="margin-top:1.5rem;">
                                <label style="display:block;margin-bottom:0.3rem;font-weight:600;font-size:0.9rem;">📝 ملاحظات:</label>
                                <textarea class="input-field" rows="2" oninput="app.notes=this.value;">${this.notes}</textarea>
                            </div>

                            <div style="margin-top:1rem;padding:0.75rem;background:#f8fafc;border-radius:0.5rem;border:1px solid #e2e8f0;">
                                <div style="font-weight:600;margin-bottom:0.5rem;color:#1e40af;font-size:0.9rem;">👤 بيانات مقدم الطلب</div>
                                <input type="text" class="input-field" style="margin-bottom:0.4rem;" value="${this.requesterName}"
                                    oninput="app.requesterName=this.value;app.saveSettings();">
                                <input type="text" class="input-field" style="margin-bottom:0.4rem;" value="${this.requesterTitle}"
                                    oninput="app.requesterTitle=this.value;app.saveSettings();">
                                <input type="text" class="input-field" value="${this.department}"
                                    oninput="app.department=this.value;app.saveSettings();">
                            </div>

                            <div style="margin-top:1.5rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0.5rem;">
                                <button class="btn btn-success" onclick="app.printRequisition();" style="font-size:0.85rem;">🖨️ طباعة</button>
                                <button class="btn btn-whatsapp" onclick="app.shareWhatsApp();" style="font-size:0.85rem;">📱 واتساب</button>
                                <button class="btn btn-email" onclick="app.shareEmail();" style="font-size:0.85rem;">📧 بريد</button>
                                <button class="btn btn-primary" onclick="app.copyOrder();" style="font-size:0.85rem;">📋 نسخ</button>
                                <button class="btn btn-primary" onclick="app.exportCSV();" style="font-size:0.85rem;">📊 CSV</button>
                                <button class="btn btn-danger" onclick="app.clearCart();" style="font-size:0.85rem;">🗑️ حذف الكل</button>
                            </div>
                            `
                        }
                    </div>
                </div>`;
            },

            renderAddForm() {
                return `
                <div class="container" style="padding: 1rem 0;">
                    <div class="card">
                        <h2 style="margin-bottom: 1.5rem;">➕ إضافة بند جديد</h2>
                        <div style="margin-bottom: 1rem;">
                            <label style="display:block;margin-bottom:0.5rem;font-weight:600;">اسم البند: *</label>
                            <input type="text" class="input-field" id="newItemName" placeholder="مثال: Glucose">
                        </div>
                        <div style="margin-bottom: 1rem;">
                            <label style="display:block;margin-bottom:0.5rem;font-weight:600;">الكود:</label>
                            <input type="text" class="input-field" id="newItemCode" placeholder="مثال: GLUC3">
                        </div>
                        <div style="margin-bottom: 1rem;">
                            <label style="display:block;margin-bottom:0.5rem;font-weight:600;">الرقم الوزاري:</label>
                            <input type="text" class="input-field" id="newItemGovCode" placeholder="787803883">
                        </div>
                        <div style="margin-bottom: 1rem;">
                            <label style="display:block;margin-bottom:0.5rem;font-weight:600;">رقم نبكو:</label>
                            <input type="text" class="input-field" id="newItemNupco" placeholder="4111620006800">
                        </div>
                        <div style="margin-bottom: 1rem;">
                            <label style="display:block;margin-bottom:0.5rem;font-weight:600;">كتالوج روش:</label>
                            <input type="text" class="input-field" id="newItemRocheCatalog" placeholder="08057800190">
                        </div>
                        <div style="margin-bottom: 1rem;">
                            <label style="display:block;margin-bottom:0.5rem;font-weight:600;">الفئة:</label>
                            <select class="input-field" id="newItemCategory">
                                ${['اختبارات بيور','كيمياء','هرمونات','مستهلكات','أمراض الدم','ميكروبيولوجيا','مستلزمات','محاليل','أنسجة']
                                    .map(c => `<option value="${c}">${c}</option>`).join('')}
                            </select>
                        </div>
                        <div style="margin-bottom: 1rem;">
                            <label style="display:block;margin-bottom:0.5rem;font-weight:600;">الفئة الفرعية:</label>
                            <input type="text" class="input-field" id="newItemSubCategory" placeholder="مثال: كيمياء عامة c303">
                        </div>
                        <div style="margin-bottom: 1rem;">
                            <label style="display:block;margin-bottom:0.5rem;font-weight:600;">حجم العبوة:</label>
                            <input type="text" class="input-field" id="newItemBoxSize" placeholder="مثال: 100">
                        </div>
                        <div style="margin-bottom: 1rem;">
                            <label style="display:block;margin-bottom:0.5rem;font-weight:600;">وحدة القياس:</label>
                            <input type="text" class="input-field" id="newItemUnit" value="اختبار">
                        </div>
                        <button class="btn btn-success" style="width: 100%;" onclick="app.addNewItemHandler();">💾 إضافة</button>
                    </div>
                </div>`;
            },

            addNewItemHandler() {
                this.newItemName = document.getElementById('newItemName').value;
                this.newItemCode = document.getElementById('newItemCode').value;
                this.newItemGovCode = document.getElementById('newItemGovCode').value;
                this.newItemNupco = document.getElementById('newItemNupco').value;
                this.newItemRocheCatalog = document.getElementById('newItemRocheCatalog').value;
                this.newItemCategory = document.getElementById('newItemCategory').value;
                this.newItemSubCategory = document.getElementById('newItemSubCategory').value;
                this.newItemBoxSize = document.getElementById('newItemBoxSize').value;
                this.newItemUnit = document.getElementById('newItemUnit').value;
                this.addNewItem();
            },
        };

        app.init();
    </script>
</body>
</html>
