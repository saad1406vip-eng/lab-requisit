            loadSettings() {
                const saved = localStorage.getItem('lab_settings_v2');
                if (saved) {
                    const s = JSON.parse(saved);
                    this.requesterName = s.requesterName || this.requesterName;
                    this.requesterTitle = s.requesterTitle || this.requesterTitle;
                    this.department = s.department || this.department;
                }
            },

            saveCart() {
                localStorage.setItem('lab_cart_v2', JSON.stringify(this.cart));
            },

            saveSettings() {
                localStorage.setItem('lab_settings_v2', JSON.stringify({
                    requesterName: this.requesterName,
                    requesterTitle: this.requesterTitle,
                    department: this.department
                }));
            },

            showToast(msg) {
                const t = document.getElementById('toast');
                t.textContent = msg;
                t.classList.add('show');
                setTimeout(() => t.classList.remove('show'), 2000);
            },

            // ─── حساب الكمية ───
            // المستخدم يدخل "عدد الكت" المطلوبة، والتطبيق يحسب الكمية الإجمالية
            calculateTotal(item) {
                const kits = parseInt(item.quantity) || 1;
                if (item.boxSize && !isNaN(parseFloat(item.boxSize))) {
                    const boxNum = parseFloat(item.boxSize);
                    return kits * boxNum;
                }
                return kits; // إذا لم يكن هناك حجم عبوة، الكمية = عدد الكت
            },

            getFormattedTotal(item) {
                const kits = parseInt(item.quantity) || 1;
                const total = this.calculateTotal(item);
                if (item.boxSize && !isNaN(parseFloat(item.boxSize))) {
                    return `${total} (${kits} × ${item.boxSize})`;
                }
                return `${total}`;
            },

            // ─── السلة ───
            addItemToCart(itemId) {
                const item = allItems.find(i => i.id === itemId);
                if (!item) return;
                const existing = this.cart.find(c => c.id === item.id);
                if (existing) {
                    existing.quantity = (parseInt(existing.quantity) || 1) + 1;
                } else {
                    this.cart.push({ ...item, quantity: 1 });
                }
                this.saveCart();
                this.showToast(`✅ تمت إضافة "${item.name}" للطلبية`);
                this.render();
            },

            removeFromCart(itemId) {
                this.cart = this.cart.filter(item => item.id !== itemId);
                this.saveCart();
                this.render();
            },

            updateQuantity(itemId, newQty) {
                const item = this.cart.find(c => c.id === itemId);
                if (item) {
                    const q = parseInt(newQty);
                    item.quantity = (q && q > 0) ? q : 1;
                    this.saveCart();
                }
            },

            clearCart() {
                if (this.cart.length === 0) return;
                if (confirm('هل أنت متأكد من حذف جميع البنود من الطلبية؟')) {
                    this.cart = [];
                    this.saveCart();
                    this.render();
                }
            },

            deleteItem(itemId) {
                if (!confirm('هل تريد حذف هذا البند من قاعدة البيانات؟')) return;
                const index = allItems.findIndex(i => i.id === itemId);
                if (index > -1) {
                    allItems.splice(index, 1);
                    this.render();
                }
            },

            // ─── إضافة بند جديد ───
            addNewItem() {
                if (!this.newItemName || !this.newItemCode) {
                    alert('الرجاء ملء الاسم والكود على الأقل');
                    return;
                }
                const newId = 'custom_' + Date.now();
                const newItem = {
                    id: newId,
                    category: this.newItemCategory,
                    name: this.newItemName,
                    code: this.newItemCode,
                    govCode: this.newItemGovCode || '',
                    nupco: this.newItemNupco || '',
                    boxSize: this.newItemBoxSize ? (isNaN(parseFloat(this.newItemBoxSize)) ? this.newItemBoxSize : parseFloat(this.newItemBoxSize)) : null,
                    unit: this.newItemUnit || 'اختبار'
                };
                allItems.unshift(newItem);
                this.newItemName = '';
                this.newItemCode = '';
                this.newItemGovCode = '';
                this.newItemNupco = '';
                this.newItemBoxSize = '';
                this.showToast('✅ تمت إضافة البند بنجاح');
                this.currentView = 'browse';
                this.render();
            },

            // ─── الإحصائيات ───
            getStats() {
                const categories = {};
                allItems.forEach(i => {
                    categories[i.category] = (categories[i.category] || 0) + 1;
                });
                return categories;
            },

            getFilteredItems() {
                return allItems.filter(item => {
                    const matchCat = this.selectedCategory === 'الكل' || item.category === this.selectedCategory;
                    const q = this.searchQuery.trim().toLowerCase();
                    const matchSearch = !q ||
                        item.name.toLowerCase().includes(q) ||
                        (item.code || '').toLowerCase().includes(q) ||
                        (item.govCode || '').toLowerCase().includes(q) ||
                        (item.nupco || '').toLowerCase().includes(q);
                    return matchCat && matchSearch;
                });
            },

            // ═══════════════════════════════════════════════════════════
            // توليد نص الطلبية (للمشاركة)
            // ═══════════════════════════════════════════════════════════
            buildOrderText(format = 'whatsapp') {
                const now = new Date();
                const dateStr = now.toLocaleDateString('ar-SA', { year: 'numeric', month: 'long', day: 'numeric' });
                const timeStr = now.toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });

                let text = '';
                text += `*طلب مستهلكات ومواد مخبرية*\n`;
                text += `━━━━━━━━━━━━━━━━━━━━\n`;
                text += `📍 ${this.department}\n`;
                text += `👤 مقدم الطلب: ${this.requesterName}\n`;
                text += `📋 ${this.requesterTitle}\n`;
                text += `📅 التاريخ: ${dateStr}\n`;
                text += `⏰ الوقت: ${timeStr}\n`;
                text += `━━━━━━━━━━━━━━━━━━━━\n\n`;

                let grandTotal = 0;
                let totalKits = 0;

                this.cart.forEach((item, idx) => {
                    const kits = parseInt(item.quantity) || 1;
                    const total = this.calculateTotal(item);
                    grandTotal += total;
                    totalKits += kits;

                    text += `*${idx + 1}. ${item.name}*\n`;
                    if (item.code) text += `   🔖 كود: ${item.code}\n`;
                    if (item.govCode) text += `   🏛️ وزاري: ${item.govCode}\n`;
                    if (item.nupco) text += `   📦 نوبكو: ${item.nupco}\n`;
                    text += `   🧪 الفئة: ${item.category}\n`;
                    text += `   📥 عدد الكت: *${kits}* كت\n`;
                    if (item.boxSize && !isNaN(parseFloat(item.boxSize))) {
                        text += `   📦 حجم العبوة: ${item.boxSize} ${item.unit || 'اختبار'}\n`;
                        text += `   ✅ الإجمالي: *${total} ${item.unit || 'اختبار'}*\n`;
                    } else if (item.boxSize) {
                        text += `   📦 حجم العبوة: ${item.boxSize}\n`;
                    }
                    text += `\n`;
                });

                text += `━━━━━━━━━━━━━━━━━━━━\n`;
                text += `📊 *الإجمالي:*\n`;
                text += `   • عدد البنود: ${this.cart.length}\n`;
                text += `   • إجمالي الكت: ${totalKits}\n`;
                if (grandTotal > 0) text += `   • إجمالي الوحدات: ${grandTotal}\n`;

                if (this.notes) {
                    text += `\n📝 *ملاحظات:*\n${this.notes}\n`;
                }

                text += `\n━━━━━━━━━━━━━━━━━━━━\n`;
                text += `✍️ التوقيع: ${this.requesterName}\n`;
                text += `© 2026 سعد القرني`;

                return text;
            },

                const text = this.buildOrderText('email');

            copyOrder() {
                if (this.cart.length === 0) {
                    alert('لا توجد بنود في الطلبية');
                    return;
                }
                const text = this.buildOrderText('text');
                navigator.clipboard.writeText(text).then(() => {
                    this.showToast('✅ تم نسخ الطلبية للحافظة');
                }).catch(() => {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    this.showToast('✅ تم نسخ الطلبية');
                });
            },

    body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; margin: 0; padding: 15px; color: #000; }
    .container { max-width: 800px; margin: 0 auto; }
    .header { text-align: center; border-bottom: 3px double #0369a1; padding-bottom: 8px; margin-bottom: 10px; }
    .header h1 { margin: 3px 0; font-size: 18px; color: #0369a1; }
    .header p { margin: 2px 0; font-size: 12px; font-weight: 600; }
    .title { text-align: center; background: #0369a1; color: white; padding: 6px; margin: 10px 0; font-size: 15px; font-weight: 700; border-radius: 4px; }
    .info { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 8px; }
    table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 10.5px; }
    th { background: #0369a1; color: white; padding: 6px 4px; text-align: center; border: 1px solid #0369a1; font-size: 10.5px; }
    td { border: 1px solid #999; padding: 5px 4px; text-align: center; vertical-align: middle; }
    tr:nth-child(even) td { background: #f0f9ff; }
    td.name { text-align: right; font-weight: 600; }
    .total-row { background: #065f46 !important; color: white; font-weight: 700; }
    .total-row td { background: #065f46 !important; color: white; border-color: #065f46; }
    .sig { margin-top: 25px; display: flex; justify-content: space-between; }
    .sig-box { text-align: center; }
    .sig-line { border-top: 2px solid #000; width: 180px; margin-top: 35px; padding-top: 4px; font-size: 11px; font-weight: 700; }
    .notes { margin-top: 12px; padding: 8px; border: 1px dashed #666; font-size: 11px; border-radius: 4px; }
    .footer { text-align: center; margin-top: 15px; font-size: 9px; color: #666; border-top: 1px solid #ccc; padding-top: 5px; }
    @media print { body { padding: 0; } .no-print { display: none; } }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <p>المملكة العربية السعودية</p>
        <p>وزارة الصحة - تجمع عسير الصحي</p>
        <h1>مختبر مستشفى سبت العلاية العام</h1>
    </div>
    <div class="title">طلب مستهلكات ومواد مخبرية</div>
    <div class="info">
        <div><strong>التاريخ:</strong> ${dateStr}</div>
        <div><strong>الوقت:</strong> ${timeStr}</div>
        <div><strong>عدد البنود:</strong> ${this.cart.length}</div>
    </div>

    <table>
        <thead>
            <tr>
                <th style="width:25px;">م</th>
                <th style="width:auto;">اسم الصنف</th>
                <th style="width:70px;">الرقم الوزاري</th>
                <th style="width:90px;">رقم نوبكو</th>
                <th style="width:40px;">عدد الكت</th>
                <th style="width:55px;">حجم العبوة</th>
                <th style="width:65px;">الكمية الإجمالية</th>
            </tr>
        </thead>
        <tbody>
            ${this.cart.map((item, idx) => {
                const kits = parseInt(item.quantity) || 1;
                const total = this.calculateTotal(item);
                const boxStr = item.boxSize ? item.boxSize : '-';
                const unitStr = item.unit || 'اختبار';
                return `<tr>
                    <td>${idx + 1}</td>
                    <td class="name">${item.name}<br><small style="color:#666;font-weight:400;">${item.code || ''}</small></td>
                    <td>${item.govCode || '-'}</td>
                    <td>${item.nupco || '-'}</td>
                    <td>${kits}</td>
                    <td>${boxStr}</td>
                    <td><strong>${total}</strong> ${item.boxSize && !isNaN(parseFloat(item.boxSize)) ? unitStr : ''}</td>
                </tr>`;
            }).join('')}
            <tr class="total-row">
                <td colspan="4">الإجمالي</td>
                <td>${totalKits} كت</td>
                <td>-</td>
                <td>${grandTotal}</td>
            </tr>
        </tbody>
    </table>

    ${this.notes ? `<div class="notes"><strong>ملاحظات:</strong> ${this.notes}</div>` : ''}

    <div class="sig">
        <div class="sig-box">
            <div style="font-weight:700;font-size:12px;">مقدم الطلب</div>
            <div class="sig-line">${this.requesterName}<br><small style="font-weight:400;">${this.requesterTitle}</small></div>
        </div>
        <div class="sig-box">
            <div style="font-weight:700;font-size:12px;">مدير المختبر</div>
            <div class="sig-line">........................</div>
        </div>
        <div class="sig-box">
            <div style="font-weight:700;font-size:12px;">التموين</div>
            <div class="sig-line">........................</div>
        </div>
    </div>

    <div class="footer">
        © 2026 سعد القرني - جميع الحقوق محفوظة
    </div>
</div>
<script>window.onload=function(){setTimeout(function(){window.print();},300);};<\/script>
</body>
</html>`;

                const w = window.open('', '_blank');
                w.document.write(html);
                w.document.close();
            },

            // ═══════════════════════════════════════════════════════════
            // تصدير CSV
            // ═══════════════════════════════════════════════════════════
            exportCSV() {
                if (this.cart.length === 0) {
                    alert('لا توجد بنود في الطلبية');
                    return;
                }
                const now = new Date();
                const dateStr = now.toLocaleDateString('en-GB');
                const timeStr = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

                let grandTotal = 0, totalKits = 0;
                const rows = [
                    ['وزارة الصحة - تجمع عسير الصحي'],
                    ['مختبر مستشفى سبت العلاية العام'],
                    ['طلب مستهلكات ومواد مخبرية'],
                    [],
                    ['التاريخ:', dateStr, 'الوقت:', timeStr],
                    ['مقدم الطلب:', this.requesterName],
                    [],
                    ['م', 'اسم الصنف', 'الفئة', 'الكود', 'الرقم الوزاري', 'رقم نوبكو', 'عدد الكت', 'حجم العبوة', 'الكمية الإجمالية', 'الوحدة']
                ];

                this.cart.forEach((item, idx) => {
                    const kits = parseInt(item.quantity) || 1;
                    const total = this.calculateTotal(item);
                    grandTotal += total;
                    totalKits += kits;
                    rows.push([
                        idx + 1,
                        item.name,
                        item.category,
                        item.code || '',
                        item.govCode || '',
                        item.nupco || '',
                        kits,
                        item.boxSize || '-',
                        total,
                        item.unit || 'اختبار'
                    ]);
                });

                rows.push([]);
                rows.push(['الإجمالي', '', '', '', '', '', totalKits, '', grandTotal, '']);

                const csv = '\uFEFF' + rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `lab_order_${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}.csv`;
                link.click();
                this.showToast('✅ تم تصدير الملف');
            },

            // ═══════════════════════════════════════════════════════════
            // عرض الصفحات
            // ═══════════════════════════════════════════════════════════
            render() {
                const appDiv = document.getElementById('app');
                appDiv.innerHTML = this.renderHeader() + this.renderContent();
            },

            renderHeader() {
                return `
                <div class="header no-print">
                    <div class="container" style="padding: 0.75rem 0;">
                        <div style="text-align: center; margin-bottom: 0.5rem; padding-bottom: 0.5rem; border-bottom: 2px solid #0369a1;">
                            <p style="margin: 0; font-weight: 700; color: #001f3f; font-size: 0.85rem;">وزارة الصحة - تجمع عسير الصحي</p>
                            <p style="margin: 3px 0; font-weight: 700; color: #0369a1; font-size: 0.95rem;">مختبر مستشفى سبت العلاية العام</p>
                        </div>
                        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem;">
                            <h1 style="font-size: 1.15rem; font-weight: 700; color: #001f3f; margin: 0;">📋 إدارة الطلبيات</h1>
                            <div style="display: flex; gap: 0.4rem; flex-wrap: wrap;">
                                ${this.currentView === 'browse' ?
                                    `<button class="btn btn-primary" onclick="app.currentView='add';app.render();" style="font-size:0.85rem;">➕ بند جديد</button>
                                     <button class="btn btn-success" onclick="app.currentView='cart';app.render();" style="font-size:0.85rem;">🛒 الطلبية (${this.cart.length})</button>` :
                                    this.currentView === 'cart' ?
                                    `<button class="btn btn-primary" onclick="app.currentView='browse';app.render();" style="font-size:0.85rem;">🔙 المتصفح</button>
                                     <button class="btn btn-primary" onclick="app.currentView='add';app.render();" style="font-size:0.85rem;">➕ بند جديد</button>` :
                                    `<button class="btn btn-primary" onclick="app.currentView='browse';app.render();" style="font-size:0.85rem;">🔙 المتصفح</button>
                                     <button class="btn btn-success" onclick="app.currentView='cart';app.render();" style="font-size:0.85rem;">🛒 الطلبية (${this.cart.length})</button>`
                                }
                            </div>
                        </div>
                    </div>
                </div>`;
            },

            renderContent() {
                if (this.currentView === 'add') return this.renderAddForm();
                if (this.currentView === 'cart') return this.renderCart();
                return this.renderBrowse();
            },

            // ─── صفحة تصفح البنود ───
            renderBrowse() {
                const filtered = this.getFilteredItems();
                const stats = this.getStats();
                const categories = ['الكل', ...Object.keys(stats)];

                return `
                <div class="container" style="padding: 1rem 0;">
                    <div class="card">
                        <div class="summary-box">
                            <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:0.5rem;align-items:center;">
                                <div>
                                    <strong style="color:#1e40af;">📊 إحصائيات قاعدة البيانات</strong>
                                    <div style="margin-top:0.4rem;font-size:0.85rem;color:#374151;">
                                        إجمالي البنود: <strong>${allItems.length}</strong> بند
                                        ${Object.entries(stats).map(([k,v]) => ` • ${k}: <strong>${v}</strong>`).join('')}
                                    </div>
                                </div>
                                ${this.cart.length > 0 ? `<div class="total-amount">🛒 الطلبية: ${this.cart.length} بند</div>` : ''}
                            </div>
                        </div>

                        <h2 style="margin-bottom: 1rem; color: #1f2937; font-size: 1.1rem;">📚 قائمة البنود</h2>

                        <div style="margin-bottom: 1rem;">
                            <input type="text" class="input-field" id="searchInput"
                                placeholder="🔍 ابحث بالاسم أو الكود أو الرقم الوزاري أو رقم نوبكو..."
                                value="${this.searchQuery}"
                                oninput="app.searchQuery=this.value;app.render();">
                        </div>

                        <div class="filter-bar">
                            ${categories.map(cat => `
                                <button class="filter-btn ${this.selectedCategory === cat ? 'active' : ''}"
                                    onclick="app.selectedCategory='${cat}';app.render();">
                                    ${cat} ${cat !== 'الكل' ? `(${stats[cat] || 0})` : ''}
                                </button>
                            `).join('')}
                        </div>

                        <div style="margin-bottom:0.5rem;color:#6b7280;font-size:0.85rem;">
                            النتائج: ${filtered.length} بند
                        </div>

                        ${filtered.length === 0 ?
                            `<div class="empty-state">🔍 لا توجد نتائج مطابقة للبحث</div>` :
                            filtered.map(item => `
                                <div class="item-card">
                                    <div class="item-info">
                                        <div class="item-name">${item.name}</div>
                                        <div class="item-code">
                                            ${item.code ? `🔖 ${item.code}` : ''}
                                            ${item.govCode ? ` • 🏛️ ${item.govCode}` : ''}
                                            ${item.nupco ? ` • 📦 ${item.nupco}` : ''}
                                            <br>
                                            <span class="badge" style="background:#e0e7ff;color:#3730a3;margin-top:4px;">${item.category}</span>
                                            ${item.boxSize ? `<span class="badge" style="background:#fef3c7;color:#92400e;margin-top:4px;">📦 ${item.boxSize} ${item.unit || 'اختبار'}</span>` : ''}
                                        </div>
                                    </div>
                                    <div class="item-actions">
                                        <button class="btn btn-success" onclick="app.addItemToCart('${item.id}');" style="font-size:0.8rem;padding:0.4rem 0.7rem;">➕ أضف</button>
                                        <button class="btn btn-danger" onclick="app.deleteItem('${item.id}');" style="font-size:0.8rem;padding:0.4rem 0.7rem;">🗑️</button>
                                    </div>
                                </div>
                            `).join('')
                        }
                    </div>
                </div>`;
            },

            // ─── صفحة الطلبية ───
            renderCart() {
                let totalKits = 0, grandTotal = 0;
                this.cart.forEach(item => {
                    totalKits += parseInt(item.quantity) || 1;
                    grandTotal += this.calculateTotal(item);
                });

                return `
                <div class="container" style="padding: 1rem 0;">
                    <div class="card">
                        <h2 style="margin-bottom: 1rem; color: #1f2937; font-size: 1.1rem;">🛒 الطلبية الحالية (${this.cart.length} بند)</h2>

                        ${this.cart.length === 0 ?
                            `<div class="empty-state">🛒 لا توجد بنود في الطلبية<br><small>اذهب للمتصفح وأضف البنود</small></div>` :
                            `
                            <div class="summary-box">
                                <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:0.5rem;">
                                    <div>📦 عدد البنود: <strong>${this.cart.length}</strong></div>
                                    <div>🧪 إجمالي الكت: <strong>${totalKits}</strong></div>
                                    <div>📊 إجمالي الوحدات: <strong>${grandTotal}</strong></div>
                                </div>
                            </div>

                            ${this.cart.map(item => {
                                const kits = parseInt(item.quantity) || 1;
                                const total = this.calculateTotal(item);
                                const hasBox = item.boxSize && !isNaN(parseFloat(item.boxSize));
                                return `
                                <div class="item-card">
                                    <div class="item-info">
                                        <div class="item-name">${item.name}</div>
                                        <div class="item-code">
                                            ${item.code ? `🔖 ${item.code}` : ''}
                                            ${item.govCode ? ` • 🏛️ ${item.govCode}` : ''}
                                            ${item.nupco ? ` • 📦 ${item.nupco}` : ''}
                                            <br>
                                            <span class="badge" style="background:#e0e7ff;color:#3730a3;">${item.category}</span>
                                            ${hasBox ? `<span class="badge" style="background:#fef3c7;color:#92400e;">📦 ${item.boxSize} ${item.unit || 'اختبار'} / كت</span>` : ''}
                                        </div>
                                        <div style="margin-top:0.5rem;padding:0.4rem 0.7rem;background:#dcfce7;border-radius:0.4rem;display:inline-block;font-size:0.8rem;">
                                            ✅ الإجمالي: <strong>${total}</strong> ${hasBox ? (item.unit || 'اختبار') : ''}
                                            ${hasBox ? `<span style="color:#166534;">(${kits} كت × ${item.boxSize})</span>` : ''}
                                        </div>
                                    </div>
                                    <div class="item-actions" style="flex-direction:column;gap:0.3rem;">
                                        <div style="display:flex;align-items:center;gap:0.3rem;">
                                            <label style="font-size:0.75rem;color:#6b7280;">عدد الكت:</label>
                                            <input type="number" min="1" value="${kits}" class="quantity-input"
                                                onchange="app.updateQuantity('${item.id}',this.value);app.render();">
                                        </div>
                                        <button class="btn btn-danger" onclick="app.removeFromCart('${item.id}');" style="font-size:0.75rem;padding:0.3rem 0.6rem;">🗑️ حذف</button>
                                    </div>
                                </div>`;
                            }).join('')}

                            <div style="margin-top:1.5rem;">
                                <label style="display:block;margin-bottom:0.3rem;font-weight:600;font-size:0.9rem;">📝 ملاحظات (اختياري):</label>
                                <textarea class="input-field" rows="2" placeholder="أي ملاحظات إضافية..."
                                    oninput="app.notes=this.value;">${this.notes}</textarea>
                            </div>

                            <div style="margin-top:1rem;padding:0.75rem;background:#f8fafc;border-radius:0.5rem;border:1px solid #e2e8f0;">
                                <div style="font-weight:600;margin-bottom:0.5rem;color:#1e40af;font-size:0.9rem;">👤 بيانات مقدم الطلب</div>
                                <input type="text" class="input-field" style="margin-bottom:0.4rem;"
                                    placeholder="الاسم" value="${this.requesterName}"
                                    oninput="app.requesterName=this.value;app.saveSettings();">
                                <input type="text" class="input-field" style="margin-bottom:0.4rem;"
                                    placeholder="المسمى الوظيفي" value="${this.requesterTitle}"
                                    oninput="app.requesterTitle=this.value;app.saveSettings();">
                                <input type="text" class="input-field"
                                    placeholder="القسم" value="${this.department}"
                                    oninput="app.department=this.value;app.saveSettings();">
                            </div>

                            <div style="margin-top:1.5rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0.5rem;">
                                <button class="btn btn-success" onclick="app.printRequisition();" style="font-size:0.9rem;">🖨️ طباعة</button>
                                <button class="btn btn-whatsapp" onclick="app.shareWhatsApp();" style="font-size:0.9rem;">📱 واتساب</button>
                                <button class="btn btn-email" onclick="app.shareEmail();" style="font-size:0.9rem;">📧 بريد</button>
                                <button class="btn btn-primary" onclick="app.copyOrder();" style="font-size:0.9rem;">📋 نسخ</button>
                                <button class="btn btn-primary" onclick="app.exportCSV();" style="font-size:0.9rem;">📊 CSV</button>
                                <button class="btn btn-danger" onclick="app.clearCart();" style="font-size:0.9rem;">🗑️ حذف الكل</button>
                            </div>
                            `
                        }
                    </div>
                </div>`;
            },

            // ─── صفحة إضافة بند جديد ───
            renderAddForm() {
                return `
                <div class="container" style="padding: 1rem 0;">
                    <div class="card">
                        <h2 style="margin-bottom: 1.5rem; color: #1f2937;">➕ إضافة بند جديد</h2>

                        <div style="margin-bottom: 1rem;">
                            <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">اسم البند: *</label>
                            <input type="text" class="input-field" id="newItemName" placeholder="مثال: TROPONIN" value="${this.newItemName}">
                        </div>
                        <div style="margin-bottom: 1rem;">
                            <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">الكود:</label>
                            <input type="text" class="input-field" id="newItemCode" placeholder="مثال: VAVA.2343" value="${this.newItemCode}">
                        </div>
                        <div style="margin-bottom: 1rem;">
                            <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">الرقم الوزاري:</label>
                            <input type="text" class="input-field" id="newItemGovCode" placeholder="مثال: 787803343" value="${this.newItemGovCode}">
                        </div>
                        <div style="margin-bottom: 1rem;">
                            <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">رقم نوبكو:</label>
                            <input type="text" class="input-field" id="newItemNupco" placeholder="مثال: 4111600421100" value="${this.newItemNupco}">
                        </div>
                        <div style="margin-bottom: 1rem;">
                            <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">الفئة:</label>
                            <select class="input-field" id="newItemCategory" style="cursor: pointer;">
                                ${['كيمياء','اختبارات بيور','هرمونات','مستهلكات','أمراض الدم','ميكروبيولوجيا','مستلزمات','محاليل','أنسجة']
                                    .map(c => `<option value="${c}" ${this.newItemCategory === c ? 'selected' : ''}>${c}</option>`).join('')}
                            </select>
                        </div>
                        <div style="margin-bottom: 1rem;">
                            <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">حجم العبوة (عدد الاختبارات في الكت):</label>
                            <input type="text" class="input-field" id="newItemBoxSize" placeholder="مثال: 100 أو TET / Kit 300" value="${this.newItemBoxSize}">
                        </div>
                        <div style="margin-bottom: 1rem;">
                            <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">وحدة القياس:</label>
                            <input type="text" class="input-field" id="newItemUnit" placeholder="مثال: اختبار، شريط، أنبوب" value="${this.newItemUnit}">
                        </div>
                        <button class="btn btn-success" style="width: 100%;" onclick="app.addNewItemHandler();">💾 إضافة البند</button>
                    </div>
                </div>`;
            },

            addNewItemHandler() {
                this.newItemName = document.getElementById('newItemName').value;
                this.newItemCode = document.getElementById('newItemCode').value;
                this.newItemGovCode = document.getElementById('newItemGovCode').value;
                this.newItemNupco = document.getElementById('newItemNupco').value;
                this.newItemCategory = document.getElementById('newItemCategory').value;
                this.newItemBoxSize = document.getElementById('newItemBoxSize').value;
                this.newItemUnit = document.getElementById('newItemUnit').value;
                this.addNewItem();
            },
        };

        app.init();
    </script>
</body>
</html>
