        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #eff6ff 0%, #f0f9ff 100%);
            color: #1a202c;
        }

        .header {
            background: white;
            border-bottom: 3px solid #3b82f6;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        .card {
            background: white;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 1.5rem;
            border-right: 4px solid #3b82f6;
        }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-success {
            background: #16a34a;
            color: white;
        }

        .btn-success:hover {
            background: #15803d;
        }

        .btn-danger {
            background: #dc2626;
            color: white;
        }

        .btn-danger:hover {
            background: #b91c1c;
        }

        .btn-add {
            background: #059669;
            color: white;
            padding: 0.5rem 1.5rem;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .btn-add:hover {
            background: #047857;
        }

        .input-field {
            border: 2px solid #d1d5db;
            border-radius: 0.5rem;
            padding: 0.5rem 1rem;
            width: 100%;
            font-size: 0.95rem;
        }

        .input-field:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-default {
            background: #e5e7eb;
            color: #374151;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
        }

        .print-header {
            text-align: center;
            border-bottom: 3px solid #0369a1;
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }

        .watermark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-45deg);
            font-size: 120px;
            color: rgba(59, 130, 246, 0.03);
            font-weight: 900;
            white-space: nowrap;
            pointer-events: none;
            z-index: -1;
            font-family: Arial, sans-serif;
        }

        .copyright-mark {
            position: fixed;
            bottom: 15px;
            left: 20px;
            font-size: 0.8rem;
            color: #999;
            opacity: 0.6;
            z-index: -1;
            pointer-events: none;
            font-weight: 500;
            font-family: Arial, sans-serif;
        }

        @media print {
            body {
                background: white;
            }
            .no-print {
                display: none !important;
            }
            .watermark {
                display: none !important;
            }
            .copyright-mark {
                display: none !important;
            }
        }

        .item-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            margin-bottom: 0.75rem;
        }

        .item-info {
            flex: 1;
        }

        .item-name {
            font-weight: 600;
            color: #1f2937;
        }

        .item-code {
            font-size: 0.875rem;
            color: #6b7280;
        }

        .item-actions {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .quantity-input {
            width: 70px;
            padding: 0.4rem;
            border: 1px solid #d1d5db;
            border-radius: 0.375rem;
        }
    </style>
</head>

                                            <div class="item-actions">
                                                <button class="btn btn-primary" onclick="app.addItemToCart('${item.id}');" style="margin-left: 0.5rem;">➕ أضف</button>
                                                <button class="btn btn-danger" onclick="app.deleteItem('${item.id}');">🗑️ حذف</button>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `}
                    </div>
                `;
                
                appDiv.innerHTML = html;
                
                // تحديث الحقول الجديدة
                if (this.currentView === 'add') {
                    document.getElementById('newItemName').addEventListener('input', (e) => this.newItemName = e.target.value);
                    document.getElementById('newItemCode').addEventListener('input', (e) => this.newItemCode = e.target.value);
                    document.getElementById('newItemCategory').addEventListener('change', (e) => this.newItemCategory = e.target.value);
                    document.getElementById('newItemBoxSize').addEventListener('input', (e) => this.newItemBoxSize = e.target.value);
                }
            },

            addNewItemHandler() {
                this.addNewItem();
                this.currentView = 'browse';
                this.render();
            },

            updateQuantity(itemId, newQty) {
                const item = this.cart.find(c => c.id === itemId);
                if (item) {
                    item.quantity = parseInt(newQty) || 1;
                    this.saveCart();
                }
            },

            attachEvents() {}
        };

        app.init();
    </script>
</body>
</html>
